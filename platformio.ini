; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
; Fixa o Arduino core 2.0.17, que é o da API de LEDC por canal
; (ledcSetup/ledcAttachPin) usada em MotorArthas.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; Nesta placa o UART0 (GPIO 43/44) NÃO está conectado — só existe o USB nativo
; (GPIO 19/20). Sem CDC_ON_BOOT o "Serial" apontaria para o UART0 e o menu de
; testes não sairia em lugar nenhum.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

monitor_speed = 115200
; O USB CDC some do host durante o reset; o monitor reconecta sozinho.
monitor_rts = 0
monitor_dtr = 0

; O ESP32-S3 não tem Bluetooth Clássico, então nada de BluetoothSerial:
; a comunicação é BLE (Nordic UART Service) via NimBLE.
; NimBLE 1.4.x é a série compatível com o core 2.0.x — a 2.x exige core 3.x.
lib_deps = h2zero/NimBLE-Arduino@^1.4.2
