; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
; Fixa o Arduino core 2.0.17, que é o da API de LEDC por canal
; (ledcSetup/ledcAttachPin) usada em MotorArthas.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; Nesta placa o UART0 (GPIO 43/44) NÃO está conectado — só existe o USB nativo
; (GPIO 19/20). Sem CDC_ON_BOOT o "Serial" apontaria para o UART0 e o menu de
; testes não sairia em lugar nenhum.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

monitor_speed = 115200
; O USB CDC some do host durante o reset; o monitor reconecta sozinho.
monitor_rts = 0
monitor_dtr = 0

; ESP32Servo: gera o pulso de servo do ESC de sucção.
;   A 0.13.x é a série compatível com o core 2.0.x.
; IRremoteESP8266: recebe o controle remoto. Apesar do nome, suporta ESP32, e
;   trata os frames de repetição do NEC que um controle de TV manda quando a
;   tecla fica pressionada.
;
; O NimBLE saiu junto com o Bluetooth: o controle agora é por infravermelho, e
; a serial USB continua para bancada.
lib_deps =
	madhephaestus/ESP32Servo@^0.13.0
	crankyoldgit/IRremoteESP8266@^2.9.0
